name: Build Firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Router Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail

          . /opt/esp/idf/export.sh

          echo "ESP-IDF:"
          idf.py --version

          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build
          idf.py partition-table
          idf.py size
          MERGED_BIN="${GITHUB_WORKSPACE}/build/merged.bin"
          idf.py merge-bin -o "${MERGED_BIN}" -f raw

          test -s "${MERGED_BIN}"
          echo "Merged image: ${MERGED_BIN}"
          ls -lh "${MERGED_BIN}"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            build/ota_data_initial.bin \
            build/esp32s3_nat_router.bin \
            build/merged.bin \
            build/flash_args
          do
            test -s "$file"
            echo "Verified: $file"
          done

          if [ -s build/phy_init_data.bin ]; then
            echo "Verified: build/phy_init_data.bin"
          else
            echo "INFO: phy_init_data.bin is not generated by this configuration."
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          cp build/bootloader/bootloader.bin artifacts/bootloader.bin
          cp build/partition_table/partition-table.bin artifacts/partition-table.bin
          cp build/ota_data_initial.bin artifacts/ota_data_initial.bin
          cp build/esp32s3_nat_router.bin artifacts/esp32s3_nat_router.bin
          cp build/merged.bin artifacts/merged.bin
          cp build/flash_args artifacts/flash_args

          if [ -s build/phy_init_data.bin ]; then
            cp build/phy_init_data.bin artifacts/phy_init_data.bin
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            artifacts/bootloader.bin \
            artifacts/partition-table.bin \
            artifacts/ota_data_initial.bin \
            artifacts/esp32s3_nat_router.bin \
            artifacts/merged.bin \
            artifacts/flash_args
          do
            test -s "$file"
            echo "Verified: $file"
          done

          if [ -s artifacts/phy_init_data.bin ]; then
            echo "Verified: artifacts/phy_init_data.bin"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Router
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
